<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>My Food App</title>
</head>

<body>
    <header class="header">
        <h1 class="headline">My Food App</h1>
        <nav class="nav-bar">
            <ul class="nav-bar__menu">  
                <li class="nav-bar__menu-option" hidden><a href="#">Settings</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-section">
        <section class="display-data-section">
            <article hidden class="dashboard">
                <table>
                    <tbody>
                        <tr class="table-row">
                            <td class="energy percentage">0%</td>
                            <td class="energy name">Brennwert</td>
                            <td class="energy value">0 kcal</td>
                        </tr>
                        <tr class="table-row">
                            <td class="carbs percentage">0%</td>
                            <td class="carbs name">Kohlenhydrate</td>
                            <td class="carbs value">0 g</td>
                        </tr>
                        <tr class="table-row">
                            <td class="sugars percentage">0%</td>
                            <td class="sugars name">davon Zucker</td>
                            <td class="sugars value">0 g</td>
                        </tr>
                        <tr class="table-row">
                            <td class="fats percentage">0%</td>
                            <td class="fats name">Fette</td>
                            <td class="fats value">0 g</td>
                        </tr>
                        <tr class="table-row">
                            <td class="fatty-acids percentage">0%</td>
                            <td class="fatty-acids name">davon ges. Fettsäuren</td>
                            <td class="fatty-acids value">0 g</td>
                        </tr>
                        <tr class="table-row">
                            <td class="proteins percentage">0%</td>
                            <td class="proteins name">Proteine</td>
                            <td class="proteins value">0 g</td>
                        </tr>
                        <tr class="table-row">
                            <td class="fibres percentage">0%</td>
                            <td class="fibres name">Ballaststoffe</td>
                            <td class="fibres value">0 g</td>
                        </tr>
                        <tr class="table-row">
                            <td class="salts percentage">0%</td>
                            <td class="salts name">Salz</td>
                            <td class="salts value">0 g</td>
                        </tr>
                    </tbody>
                </table>
            </article>
            
        </section>
        
        <section class="input-container">
            <form action="" id="input-form" class="input-form">
                <label for="ingredients-name" class="input-section label">Name der Zutat</label>
                <input type="text" name="name" id="ingredients-name" class="input-field">

                <label for="ingredients-amount" class="input-section label">Menge (g)</label>
                <input type="number" name="amount" id="ingredients-amount" class="input-field">

                <button type="submit" id="form-submit-button" class="form-submit-button">Zutat hinzufügen</button>
            </form>
        </section>

        <template id="ingredient-card">
                <details class="card">
                    <summary class="card-summary">
                        <p class="ingredient-name"></p>
                        <p class="ingredient-amount value"></p>
                    </summary>
                    <div class="nutrition-value-container">
                        <p class="col-3">Kalorien</p>
                        <p class="calories value"></p>
                        
                        <p class="col-3">Kohlenhydrate</p>
                        <p class="carbohydrates value"></p>
                        
                        <p class="col-3">davon Zucker</p>
                        <p class="thereof-sugars value"></p>
                        
                        <p class="col-3">Fett</p>
                        <p class="fats value"></p>
                        
                        <p class="col-3">davon ges. Fettsäuren</p>
                        <p class="thereof-fattyacids value"></p>
                        
                        <p class="col-3">Eiweiß</p>
                        <p class="proteins value"></p>
                        
                        <p class="col-3">Ballaststoffe</p>
                        <p class="fibre value"></p>
                        
                        <p class="col-3">Salz</p>
                        <p class="salt value"></p>

                    </div>
                </details>
                
            
        </template>   
    </main>
    
    <script src="main.js"></script>
</body>
</html>
